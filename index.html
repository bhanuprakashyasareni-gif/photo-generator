<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI Photo Generator</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <div class="card">

      <h1>📸 Create Your Image</h1>

      <p class="subtitle">
        Upload two photos and we'll create your image.
      </p>


      <form id="uploadForm">

        <!-- NAME -->

        <label for="name">
          Your Name
        </label>

        <input
          id="name"
          type="text"
          placeholder="Enter your name"
          required
          maxlength="100"
        >


        <!-- EMAIL -->

        <label for="email">
          Your Email
        </label>

        <input
          id="email"
          type="email"
          placeholder="Enter your email"
          required
          maxlength="200"
        >


        <!-- PHOTO 1 -->

        <div class="photo-box">

          <h2>📷 Photo 1</h2>

          <input
            id="photo1"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            required
          >

          <div
            id="preview1"
            class="preview"
          ></div>

        </div>


        <!-- PHOTO 2 -->

        <div class="photo-box">

          <h2>📷 Photo 2</h2>

          <input
            id="photo2"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            required
          >

          <div
            id="preview2"
            class="preview"
          ></div>

        </div>


        <!-- BUTTON -->

        <button
          id="submitButton"
          type="submit"
        >
          Upload My Photos
        </button>


        <!-- MESSAGE -->

        <div
          id="message"
          class="message"
        ></div>

        <p class="limit">
          Each photo must be smaller than 6 MB.
        </p>

      </form>

    </div>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- OUR JAVASCRIPT -->

  <script src="app.js"></script>

</body>

</html>
